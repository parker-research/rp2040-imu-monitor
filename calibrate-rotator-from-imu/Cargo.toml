[package]
name = "calibrate-rotator-from-imu"
version = "0.1.0"
edition = "2021"
description = "IMU-referenced zero calibration for hamlib rotctld antenna rotators"

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serialport = { version = "4", default-features = false }
ctrlc = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.8"
rand_distr = "0.4"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3"
